[project]
name = "agent-chat-backend"
version = "0.1.0"
description = "Agno AgentOS + AG-UI backend for agent chat app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agno[os,agui]",
    "openai",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
